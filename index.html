<style>
/* Same design system as the D8 HTML playbooks: Barlow Condensed headings, sticky tab bar, white panels,
   attack = orange, defence = blue, one colour per player. Fonts are self-hosted (fonts/, SIL OFL). */

@font-face{font-family:D8Body;font-weight:600;font-display:swap;src:url(fonts/source-sans-3-latin-600-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:D8Body;font-weight:700;font-display:swap;src:url(fonts/source-sans-3-latin-700-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:D8Body;font-weight:400;font-display:swap;src:url(fonts/source-sans-3-cyrillic-400-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}

@font-face{font-family:D8Mono;font-weight:500;font-display:swap;src:url(fonts/jetbrains-mono-latin-500-normal.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215}
@font-face{font-family:D8Mono;font-weight:500;font-display:swap;src:url(fonts/jetbrains-mono-cyrillic-500-normal.woff2) format("woff2");unicode-range:U+0301,U+0400-045F,U+0490-0491,U+04B0-04B1,U+2116}
:root{
  --bg:#eef1f4; --panel:#ffffff; --fg:#151a21; --muted:#5b6573; --line:#d6dce3;
  --atk:#d9631c; --def:#2b6fd6; --atk-bg:#fbe9dd; --def-bg:#e1ebfb;
  --dima:#b8860b; --renat:#0f8f86; --roman:#7a4fd1; --nikita:#c43b3b; --sanya:#2f8a3e;
  --good:#2f8a3e; --bad:#c43b3b; --onfg:#fff;
  --display:D8Display,"Barlow Condensed","Roboto Condensed","Arial Narrow",Arial,sans-serif;
  --body:D8Body,"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:D8Mono,"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1318; --panel:#171d24; --fg:#e7ebf0; --muted:#97a2b0; --line:#2a333d;
  --atk:#f08a45; --def:#5b95f0; --atk-bg:#3a2416; --def-bg:#172a45;
  --dima:#e0b13c; --renat:#2ec4b8; --roman:#a585ef; --nikita:#ee6b6b; --sanya:#5cc46c;
  --good:#5cc46c; --bad:#ee6b6b; --onfg:#0f1318; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1318; --panel:#171d24; --fg:#e7ebf0; --muted:#97a2b0; --line:#2a333d;
  --atk:#f08a45; --def:#5b95f0; --atk-bg:#3a2416; --def-bg:#172a45;
  --dima:#e0b13c; --renat:#2ec4b8; --roman:#a585ef; --nikita:#ee6b6b; --sanya:#5cc46c;
  --good:#5cc46c; --bad:#ee6b6b; --onfg:#0f1318; color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--body);padding:0 max(16px,env(safe-area-inset-right,0px)) calc(40px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
a{color:inherit;text-decoration:none}
.wrap{max-width:1080px;margin:0 auto}
/* header */
.ph{padding-block:16px 10px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;position:relative}
.crumb{width:100%;font:600 .72rem/1 var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px;align-items:center;margin-bottom:2px}
.crumb a{color:var(--def)}
h1{font:700 2rem/1 var(--display);letter-spacing:.02em;text-transform:uppercase;margin:0;padding-right:96px;text-wrap:balance}
h1 b{color:var(--def)}
.sub{color:var(--muted);font-size:.9rem;width:100%}
.ph .lang{position:absolute;right:0;top:14px}
.ph.crumbed .lang{top:30px}
/* tab bar */
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0;margin-top:4px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:4px}
nav.tabs a{font:600 1rem/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:8px 10px;border-radius:6px;white-space:nowrap;cursor:pointer}
nav.tabs a.on{color:var(--onfg);background:var(--fg)}
nav.tabs a.atk.on{background:var(--atk);color:#fff} nav.tabs a.def.on{background:var(--def);color:#fff}
nav.tabs a .star{color:#f5a524;margin-left:3px}
a:focus-visible,button:focus-visible,.shot:focus-visible{outline:2px solid var(--def);outline-offset:2px}
/* sections and panels */
section.pg{display:grid;gap:14px;padding-top:16px;min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px}
h2{font:700 1.6rem/1.05 var(--display);text-transform:uppercase;letter-spacing:.03em;margin:0;text-wrap:balance}
h3{font:700 1.05rem/1.2 var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center}
.tag{font:600 .72rem/1 var(--mono);padding:5px 8px;border-radius:4px;text-transform:uppercase;letter-spacing:.04em;background:var(--line);color:var(--fg);white-space:nowrap}
.tag.d{background:var(--def-bg);color:var(--def)} .tag.a{background:var(--atk-bg);color:var(--atk)}
.tag.good{background:transparent;color:var(--good);border:1px solid var(--good)} .tag.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.lead{margin:0;max-width:72ch}
p{margin:0}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;align-content:start}
.box>h3{margin:0}
.box.d{border-top:3px solid var(--def)} .box.a{border-top:3px solid var(--atk)} .box.acc{border-top:3px solid var(--atk)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.tw{overflow-x:auto;margin:0 -4px;padding:0 4px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th{font:600 .72rem/1.2 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:4px 8px 6px;border-bottom:1px solid var(--line);vertical-align:bottom}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n{font:600 .8rem var(--mono);color:var(--muted);width:1.5em}
tbody th{font:600 .74rem/1.3 var(--mono);text-transform:none;letter-spacing:0;vertical-align:top;width:38%;padding-top:7px}
.wide table{min-width:560px}
.p{display:inline-block;font:700 .8rem/1 var(--body);padding:4px 8px;border-radius:999px;color:#fff;white-space:nowrap}
.p.dima{background:var(--dima)} .p.renat{background:var(--renat)} .p.roman{background:var(--roman)} .p.nikita{background:var(--nikita)} .p.sanya{background:var(--sanya)}
:root[data-theme="dark"] .p{color:#0f1318}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .p{color:#0f1318}}
ul.tight{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.92rem}
ol.steps{margin:0;padding-left:22px;display:grid;gap:6px;font-size:.92rem}
ol.steps li::marker{font:600 .85rem var(--mono);color:var(--muted)}
.note{font-size:.85rem;color:var(--muted);margin:0}
.good{color:var(--good);font-weight:600} .bad{color:var(--bad);font-weight:600}
mark{background:#fde68a;color:#111;border-radius:3px;padding:0 1px}
mark.me{background:transparent;color:inherit;font-weight:700;box-shadow:inset 0 -.45em 0 var(--hl,#fde68a)}
/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:700px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-width:0}
.kpi b{display:block;font:700 1.7rem/1 var(--display);margin-bottom:4px}
.kpi span{font-size:.8rem;line-height:1.3;color:var(--muted);display:block}
.kpi b.good{color:var(--good)} .kpi b.bad{color:var(--bad)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%}.bar.a i{background:var(--atk)}.bar.d i{background:var(--def)}
/* screenshots */
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:700px){.strip{grid-template-columns:repeat(2,minmax(0,1fr))}}
.shot{all:unset;cursor:zoom-in;display:grid;gap:4px;min-width:0}
.shot img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:6px;border:1px solid var(--line);display:block;background:var(--line)}
.strip.sq .shot img{aspect-ratio:1;object-fit:contain;background:#fff}
.shot span{font:600 .72rem/1.25 var(--mono);color:var(--muted)}
/* checklist */
.chk{display:grid;gap:6px}
.chk label{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;cursor:pointer;padding:4px 0;border-bottom:1px dashed var(--line)}
.chk label:last-child{border-bottom:0}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--def);flex:none}
/* list rows (home tabs) */
.rows{display:grid}
.row{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .ic{font-size:22px;width:28px;text-align:center;flex:none}
.row .tx{flex:1;min-width:0;display:grid;gap:2px}
.row .tx b{font:700 1.08rem/1.15 var(--display);text-transform:uppercase;letter-spacing:.04em}
.row .tx small{color:var(--muted);font-size:.82rem}
.row .go{color:var(--muted);font:600 1.2rem var(--mono)}
.row .num{font:600 .75rem var(--mono);color:var(--muted);flex:none;width:2.2em}
.row .star{color:#f5a524}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font:700 1.15rem/1 var(--display);flex:none}
.av.big{width:56px;height:56px;font-size:1.6rem}
.av.dima{background:var(--dima)}.av.renat{background:var(--renat)}.av.roman{background:var(--roman)}.av.nikita{background:var(--nikita)}.av.sanya{background:var(--sanya)}
/* search */
.search{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.search input{flex:1;border:0;background:none;outline:0;font:inherit;color:inherit;min-width:0}
.search span{font:600 .72rem var(--mono);text-transform:uppercase;color:var(--muted)}
.hit{display:grid;gap:2px;padding:9px 2px;border-bottom:1px solid var(--line)}
.hit small{font:600 .7rem var(--mono);text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.hit b{font-weight:700}.hit span{font-size:.86rem;color:var(--muted)}
/* buttons */
.seg{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.seg button{font:600 .95rem/1 var(--display);text-transform:uppercase;letter-spacing:.05em;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:8px 12px;border-radius:6px;cursor:pointer}
.seg button.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.seg button.on.a{background:var(--atk);border-color:var(--atk);color:#fff}
.seg button.on.d{background:var(--def);border-color:var(--def);color:#fff}
.lang button{padding:6px 10px}
.fav{font:600 1.1rem/1 var(--body);border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:6px;width:34px;height:34px;cursor:pointer;flex:none;display:grid;place-items:center;padding:0}
.fav.on{color:#f5a524;border-color:#f5a524}
.head .fav{margin-left:auto}
.btn{font:600 .9rem/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--def);display:inline-flex;gap:6px;align-items:center}
.empty{color:var(--muted);text-align:center;padding:24px 8px}
/* round chips in review tables */
.rd{display:flex;flex-wrap:wrap;gap:3px}
.rd i{font:600 .7rem/1 var(--mono);font-style:normal;padding:3px 4px;border-radius:3px;border:1px solid var(--line)}
.rd i.w{color:var(--good);border-color:var(--good)} .rd i.l{color:var(--bad);border-color:var(--bad);opacity:.85}
.mlab{font:600 .7rem/1.2 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-top:4px}
.quote{border-left:3px solid var(--line);padding-left:10px;font-size:.92rem}
.ka{color:var(--atk);font-weight:600}.kd{color:var(--def);font-weight:600}
details.box>summary{list-style:none;cursor:pointer}details.box>summary::-webkit-details-marker{display:none}
details.box>summary h3{margin:0}details.box>summary h3::after{content:"▾";margin-left:auto;color:var(--muted);font-family:var(--mono)}
details.box:not([open])>summary h3::after{content:"▸"}
/* line-ups */
.lu{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:.9rem}
.lu .p{text-align:center;min-width:64px}
.luh{display:flex;gap:8px;align-items:center;justify-content:space-between}
/* profile */
.phead{display:flex;gap:12px;align-items:center}
.phead div{display:grid;gap:4px;justify-items:start}
.phead b{font:700 1.3rem/1 var(--display);text-transform:uppercase;letter-spacing:.03em}
.phead small{color:var(--muted);font:600 .75rem var(--mono)}
.habit{font-size:.95rem}
.spark{width:100%;height:auto;display:block}.spark polyline{fill:none;stroke:var(--def);stroke-width:2.5}
.spark circle{fill:var(--def)}.spark text{font:600 9px var(--mono);fill:var(--fg);text-anchor:middle}.spark text.d{fill:var(--muted);font-weight:500}
.spark .one{stroke:var(--muted);stroke-dasharray:3 4;stroke-width:1}
/* strat board (DOM is static, moved into a section by app.js) */
#boardBox{display:grid;gap:12px}
.brow{display:grid;gap:6px}
.brow .lab{font:600 .72rem/1 var(--mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ctl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:center}
.ctl .small{font:600 .72rem var(--mono);text-transform:uppercase;color:var(--muted);margin-right:2px}
#bsvg{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;display:block;user-select:none}
#bsvg .tok{cursor:grab}
#phaseText{margin:0;padding-left:20px;font-size:.88rem;display:grid;gap:4px}#phaseText li{color:var(--muted);cursor:pointer}#phaseText li.cur{color:var(--fg);font-weight:700}
.sub2{font:700 1.05rem/1.2 var(--display);text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 8px;display:flex;justify-content:space-between;align-items:center}
#lineupList{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center;font-size:.9rem}#lineupList .p{text-align:center;min-width:64px}
.muted{color:var(--muted)}
#legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;font-size:.82rem;padding-top:8px}#legend span{display:flex;gap:6px;align-items:center}
.sw{flex:none;display:inline-block;min-width:22px;text-align:center}
details.lg summary{font:600 .95rem/1 var(--display);text-transform:uppercase;letter-spacing:.06em;color:var(--def);cursor:pointer}
#dragNote{font-size:.8rem;color:var(--muted);margin:0}
#resetPos{justify-self:start;border:0;background:none;color:var(--def);font:600 .9rem/1 var(--display);text-transform:uppercase;letter-spacing:.06em;padding:0;cursor:pointer}
/* chrome */
#topBtn{position:fixed;right:14px;bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:9;border:0;width:42px;height:42px;border-radius:8px;background:var(--fg);color:var(--bg);font:700 18px var(--mono);box-shadow:0 4px 14px #0003;opacity:0;pointer-events:none;transition:.2s;cursor:pointer}
#topBtn.show{opacity:1;pointer-events:auto}
#lb{position:fixed;inset:0;z-index:20;background:rgba(5,8,12,.88);display:grid;place-items:center;padding:10px}
#lb img{max-width:100%;max-height:86vh;border-radius:6px}#lb p{color:#e7ebf0;font:600 .85rem var(--mono);text-align:center;margin:8px 0 0}
@media (prefers-reduced-motion:no-preference){section.pg{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}}}
</style>
</head>
<body>
<div class="wrap" id="view"></div>
<button id="topBtn" aria-label="Top">↑</button>
<div id="lb" hidden><div><img id="lbImg" alt=""><p id="lbCap"></p></div></div>
<div id="boardHome" hidden><div id="boardBox">
 <div class="brow" id="rowD"><span class="lab">Defence</span><div class="seg" id="stratSelD"></div></div>
 <div class="brow" id="rowA"><span class="lab">Attack</span><div class="seg" id="stratSelA"></div></div>
 <div class="ctl"><div class="seg" id="floorSel"></div><div class="seg"><span class="small" id="phLab">Phases</span><span class="seg" id="phaseSel"></span></div></div>

 <p id="dragNote"></p>
 <ol id="phaseText"></ol>
 <div><p class="sub2"><span id="lineupTitle">Lineup</span><button class="fav" id="stratFav" data-fav="">☆</button></p><div id="lineupList"></div></div>
 <details class="lg"><summary id="lgSum">Legend</summary><div id="legend"></div></details>
 <button id="resetPos">Reset</button>
</div></div>
